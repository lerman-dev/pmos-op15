name: Build postmarketOS Phosh Initramfs

on:
  workflow_dispatch: # Позволяет запускать сборку вручную из веб-интерфейса

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Расширяем место на сервере, так как сборка графики требует много пространства
    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 5120
        swap-size-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    # Шаг 2: Ставим зависимости и сам pmbootstrap на сервер Ubuntu
    - name: Install pmbootstrap & dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip openssl git openssh-client
        pip3 install pmbootstrap

    # Шаг 3: Конфигурируем сборщик под OnePlus 15 с графикой Phosh
    - name: Initialize pmbootstrap
      run: |
        pmbootstrap init --work=/home/runner/pmbootstrap \
          --release=edge \
          --device=oneplus-infiniti \
          --ui=phosh \
          --mirror-alpine=http://alpinelinux.org

    # Шаг 4: Собираем систему, упакованную целиком в RAM-диск (initramfs)
    - name: Build RAM Image (Split/Initramfs)
      run: |
        # Флаг --no-fhs критичен для корректной сборки в виртуальной среде GitHub
        pmbootstrap install --split --no-fhs

    # Шаг 5: Ищем скомпилированный образ и переносим его в отдельную папку
    - name: Find and Export Image
      run: |
        mkdir output
        # Ищем готовый initramfs образ внутри рабочих папок pmbootstrap
        find /home/runner/pmbootstrap/chroot_native/home/pmos/rootfs/ -name "*initramfs*" -exec cp {} ./output/ \;
        echo "=== Файлы, готовые к отправке ==="
        ls -la ./output

    # Шаг 6: Выгружаем готовый .img файл в артефакты GitHub, чтобы вы могли его скачать
    - name: Upload Artifacts
      uses: actions/artifacts@v4
      with:
        name: pmos-phosh-oneplus15
        path: ./output/*
