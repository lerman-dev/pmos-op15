name: Build postmarketOS Phosh Initramfs

on:
  workflow_dispatch: # Позволяет запускать сборку вручную из веб-интерфейса

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Расширяем место на сервере для тяжелой сборки
    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 5120
        swap-size-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    # Шаг 2: Ставим базовые системные зависимости и разворачиваем pmbootstrap из Git
    - name: Install pmbootstrap from Git source
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip openssl git openssh-client python3-tomli
        
        # Клонируем официальный pmbootstrap и создаем ссылку в PATH
        git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /home/runner/pmbootstrap-src
        mkdir -p ~/.local/bin
        ln -s /home/runner/pmbootstrap-src/pmbootstrap.py ~/.local/bin/pmbootstrap
        
        # Проверяем, что утилита доступна глобально
        echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV
        export PATH="$HOME/.local/bin:$PATH"
        pmbootstrap --version

    # Шаг 3: Конфигурируем сборщик под OnePlus 15 (infiniti)
    - name: Initialize pmbootstrap
      run: |
        pmbootstrap init --work=/home/runner/pmbootstrap \
          --release=edge \
          --device=oneplus-infiniti \
          --ui=phosh \
          --mirror-alpine=http://alpinelinux.org

    # Шаг 4: Собираем графическую систему в RAM-диск
    - name: Build RAM Image (Split/Initramfs)
      run: |
        pmbootstrap install --split --no-fhs

    # Шаг 5: Экспортируем готовый скомпилированный образ
    - name: Find and Export Image
      run: |
        mkdir output
        find /home/runner/pmbootstrap/chroot_native/home/pmos/rootfs/ -name "*initramfs*" -exec cp {} ./output/ \;
        echo "=== Файлы, готовые к отправке ==="
        ls -la ./output

    # Шаг 6: Выгружаем артефакт на GitHub
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pmos-phosh-oneplus15
        path: ./output/*
